[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tts-bot"
version = "0.1.0"
description = "Discord bot for TTS + RVC voice synthesis"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "discord.py[voice]>=2.3.2",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.1",
    "piper-tts>=1.2.0",
    "numpy>=1.24.0",
    "soundfile>=0.12.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ttsbot*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]