[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ttsbot-diarize"
version = "0.1.0"
description = "Speaker diarization modules for TTS-bot (shared between ttsbot and GPU server)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "librosa",
    "numpy",
    "scipy",
    "soundfile",
    "scikit-learn",
    "torch",
    "torchaudio",
    "transformers",
]

[project.optional-dependencies]
pyannote = [
    "pyannote.audio>=3.1.1,<5.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ttsbot_diarize*"]

[tool.setuptools.package-dir]
"" = "."