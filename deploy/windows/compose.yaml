# Run from WSL: docker compose -f deploy/windows/compose.yaml up -d --build
services:
  rvc-server:
    extends:
      file: ../../rvc-gpu-server/compose.yaml
      service: rvc-server
    gpus: all
    environment:
      ONNX_PROVIDER: CUDAExecutionProvider
    volumes:
      # Reuse ifrit's dependency image, but run this checkout's server code.
      - ${HOME}/TTS-bot/rvc-gpu-server:/app:ro
      - voice-models:/home/haama/TTS-bot/rvc_models:ro

  model-sync:
    build: ./model-sync
    image: ttsbot-model-sync:latest
    restart: always
    # 2223 avoids colliding with the temporary WSL SSH bootstrap on 2222.
    ports:
      - "2223:22"
    volumes:
      - voice-models:/home/haama/TTS-bot/rvc_models
      # WSL bind projections can be missing/empty when Docker Desktop restarts.
      - ssh-authorized-keys:/etc/ssh/authorized_keys:ro
      - ssh-host-keys:/etc/ssh/keys
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  ssh-host-keys:
  ssh-authorized-keys:
    name: ttsbot-model-sync-authorized-keys
    external: true
  voice-models:
    name: ttsbot-rvc-voice-models
    external: true
